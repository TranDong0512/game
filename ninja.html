<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>🥷 Làng Ninja Huyền Thoại</title>
<style>
:root { --bg: #0d0b16; --panel: #1a1628; --panel2: #231d36; --line: #3a3150; --text: #efe9ff; --dim: #9b90b8; --gold: #ffd257; --accent: #ff6a3a; --ok: #36d67a; }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, 'Segoe UI', Roboto, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#game { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
#cv { width: 100%; height: 100%; display: block; }
#menuBtns { position: absolute; top: 1.2%; right: 1%; display: flex; gap: 4px; z-index: 5; }
#menuBtns button { width: clamp(28px, 4.4vw, 44px); height: clamp(28px, 4.4vw, 44px); border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(20,16,40,.7); color: #fff; font-size: clamp(14px, 2.2vw, 20px); cursor: pointer; position: relative; }
#menuBtns button:hover { background: rgba(60,40,110,.85); }
#menuBtns .dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: #ff3a5a; display: none; }
#bossBar { position: absolute; left: 50%; transform: translateX(-50%); top: 12.5%; z-index: 5; display: none; align-items: center; gap: 8px; background: rgba(60,8,20,.82); border: 1px solid #ff5a6a; color: #fff; padding: 5px 10px; border-radius: 20px; font-size: clamp(10px, 1.5vw, 13px); font-weight: 800; white-space: nowrap; }
#bossBar button { background: #ff5a6a; color: #fff; border: 0; border-radius: 12px; padding: 3px 10px; font-weight: 800; cursor: pointer; font-size: inherit; }
#toasts { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; z-index: 8; }
.toast { background: rgba(20,16,40,.88); border: 1px solid var(--line); border-radius: 16px; padding: 4px 12px; font-weight: 800; font-size: clamp(10px, 1.25vw, 14px); animation: tin .25s; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
#rotate { display: none; position: absolute; left: 0; right: 0; top: 0; padding: 4px; text-align: center; font-size: 11px; background: rgba(255,210,87,.15); color: var(--gold); z-index: 6; }

/* Nút cảm ứng */
#pad { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 4; }
body.touch #pad { display: block; }
.pb { pointer-events: auto; position: absolute; border-radius: 50%; background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.28); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: clamp(12px, 2.4vw, 22px); touch-action: none; }
.pb.on { background: rgba(255,255,255,.32); }
.pb small { position: absolute; bottom: 2px; font-size: 9px; color: #9fd0ff; font-weight: 800; }
.pb.dim { opacity: .35; }
.pb.lock { opacity: .18; }
#pL { left: 2%; bottom: 6%; width: 12%; aspect-ratio: 1; }
#pR { left: 15.5%; bottom: 6%; width: 12%; aspect-ratio: 1; }
#pD { left: 9%; bottom: 27%; width: 9%; aspect-ratio: 1; font-size: clamp(10px, 1.8vw, 16px); }
#pA { right: 3%; bottom: 7%; width: 13%; aspect-ratio: 1; background: rgba(255,90,60,.3); }
#pJ { right: 17%; bottom: 4%; width: 10%; aspect-ratio: 1; }
#pE { right: 17%; bottom: 23%; width: 7.5%; aspect-ratio: 1; font-size: clamp(11px, 1.8vw, 18px); display: none; background: rgba(255,210,87,.35); }
#pHP { left: 2%; bottom: 33%; width: 6.5%; aspect-ratio: 1; font-size: clamp(11px, 1.8vw, 18px); }
#pMP { left: 2%; bottom: 46%; width: 6.5%; aspect-ratio: 1; font-size: clamp(11px, 1.8vw, 18px); }
.psk { width: 7.6%; aspect-ratio: 1; font-size: clamp(12px, 2vw, 20px); }

/* Cửa sổ */
#modal { position: fixed; inset: 0; background: rgba(5,3,12,.72); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 10px; }
#modal.hidden { display: none; }
#mbox { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; width: min(760px, 100%); max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.mhead { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.mhead h3 { flex: 1; font-size: 16px; }
.mtabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px 0; }
.mtabs button { flex: none; padding: 7px 11px; border-radius: 10px 10px 0 0; border: 1px solid var(--line); border-bottom: 0; background: var(--panel2); color: var(--dim); font-weight: 800; font-size: 12.5px; cursor: pointer; }
.mtabs button.on { background: #2e2550; color: #fff; }
.mbody { padding: 12px; overflow-y: auto; flex: 1; }
.btn { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-weight: 700; cursor: pointer; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: #8b6cff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.pri { background: linear-gradient(135deg, #6a4cff, #b44cff); border-color: transparent; color: #fff; }
.btn.ok { background: #1f4a33; border-color: #36d67a; }
.btn.warn { background: #4a1f25; border-color: #ff5a6a; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.x { background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; padding: 0 6px; }
.sec { margin-bottom: 12px; }
.sec h4 { font-size: 13px; color: var(--gold); margin-bottom: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 13px; }
.dim { color: var(--dim); }
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.bag { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.it { aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--line); background: rgba(0,0,0,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; font-size: 22px; }
.it .lb { font-size: 9px; color: var(--dim); font-weight: 700; }
.it .pl { position: absolute; top: 1px; right: 4px; font-size: 10px; font-weight: 900; color: var(--gold); }
.it .up { position: absolute; bottom: 1px; left: 4px; font-size: 10px; color: #6dff9c; font-weight: 900; }
.it.empty { opacity: .45; }
.it.sel { outline: 3px solid var(--gold); }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel2); font-size: 12.5px; }
.card .ttl { font-weight: 800; margin-bottom: 3px; }
.ln { display: flex; justify-content: space-between; padding: 1px 0; }
.aff { color: #9fd0ff; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel2); margin-bottom: 6px; }
.row .ic { font-size: 26px; width: 40px; text-align: center; flex: none; }
.row .bd { flex: 1; min-width: 0; font-size: 12.5px; }
.row .bd b { font-size: 13.5px; }
.row.lock { opacity: .5; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.stones { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.stone { border: 1px solid var(--line); border-radius: 10px; padding: 5px 2px; text-align: center; background: rgba(0,0,0,.25); font-size: 11px; cursor: pointer; }
.stone b { display: block; font-size: 15px; }
.stone.has { border-color: #4ab8ff; }
.stone .sel { color: var(--gold); font-weight: 900; }
.bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar > div { height: 100%; background: linear-gradient(90deg, #6a4cff, #ff6aa8); }
textarea.txt, input.txt { width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0f0d1d; color: #fff; font-size: 13px; }
textarea.txt { height: 80px; font-size: 11px; }
.better { color: #6dff9c; } .worse { color: #ff7070; }
.npcTalk { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
.npcTalk .av { font-size: 40px; }
.npcTalk .say { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; font-size: 13.5px; line-height: 1.5; flex: 1; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts .btn { text-align: left; }
.classes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cls { border: 2px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; background: var(--panel2); text-align: center; }
.cls:hover { border-color: #8b6cff; }
.cls .i { font-size: 32px; }
@media (orientation: portrait) {
    #app { justify-content: flex-start; }
    #game { width: 100vw; }
    #rotate { display: block; position: fixed; top: calc(100vw * 9 / 16 + 4px); bottom: auto; }
    body.touch #game { overflow: visible; }
    body.touch #pad { position: fixed; top: calc(100vw * 9 / 16); bottom: 0; left: 0; right: 0; inset: auto 0 0 0; height: calc(100vh - 100vw * 9 / 16); }
    body.touch #pL { width: 20%; } body.touch #pR { left: 24%; width: 20%; } body.touch #pD { left: 14%; width: 14%; bottom: 34%; }
    body.touch #pA { width: 22%; } body.touch #pJ { right: 27%; width: 17%; } body.touch #pE { right: 27%; width: 13%; bottom: 30%; }
    body.touch #pHP { width: 12%; bottom: 58%; } body.touch #pMP { width: 12%; left: 16%; bottom: 58%; }
    body.touch .psk { width: 13%; }
    .slots { grid-template-columns: repeat(5, 1fr); } .bag { grid-template-columns: repeat(6, 1fr); }
}
</style>
</head>
<body>
<div id="app">
    <div id="game">
        <canvas id="cv" width="960" height="540"></canvas>
        <div id="rotate">📱 Xoay ngang điện thoại để chơi thoải mái hơn</div>
        <div id="menuBtns">
            <button onclick="openMenu('char')" title="Nhân vật (C)">👤<span class="dot" id="dotChar"></span></button>
            <button onclick="openMenu('bag')" title="Túi đồ (B)">🎒</button>
            <button onclick="openMenu('skill')" title="Kỹ năng (V)">✨<span class="dot" id="dotSkill"></span></button>
            <button onclick="openMenu('quest')" title="Nhiệm vụ (N)">📜<span class="dot" id="dotQuest"></span></button>
            <button onclick="openMenu('map')" title="Bản đồ (M)">🗺️</button>
            <button onclick="openMenu('opt')" title="Cài đặt">⚙️</button>
        </div>
        <div id="bossBar"><span id="bossTxt"></span><button id="bossGo" onclick="goWorldBoss()">Đến ngay</button></div>
        <div id="toasts"></div>
        <div id="pad">
            <div class="pb" id="pL">◀</div><div class="pb" id="pR">▶</div><div class="pb" id="pD">▼</div>
            <div class="pb" id="pA">⚔️</div><div class="pb" id="pJ">⤒</div><div class="pb" id="pE">💬</div>
            <div class="pb" id="pHP">🧪<small id="pHPn">0</small></div><div class="pb" id="pMP">🔵<small id="pMPn">0</small></div>
            <div id="pSk"></div>
        </div>
    </div>
</div>
<div id="modal" class="hidden"><div id="mbox"></div></div>
<script>
// =====================================================================
//  TIỆN ÍCH
// =====================================================================
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => { n = Math.floor(n); if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M'; if (n >= 1e5) return (n / 1e3).toFixed(0) + 'K'; return n.toLocaleString('vi-VN'); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

// =====================================================================
//  DỮ LIỆU GAME
// =====================================================================
const ELEM = {
    fire:  { n: 'Hỏa',  c: '#ff6a3a', icon: '🔥', beats: 'wind' },
    water: { n: 'Thủy', c: '#4ab8ff', icon: '💧', beats: 'fire' },
    wind:  { n: 'Phong', c: '#5ae88a', icon: '🍃', beats: 'water' }
};
const SCHOOLS = {
    fire:  { n: 'Trường Hỏa Vân',   master: 'Thầy Hỏa Vân',   elem: 'fire',  c: '#ff4a2a', weapons: ['sword', 'star'], d: 'Sát thương cao, kỹ năng bùng nổ. Bị động: Tấn công +10%.' },
    water: { n: 'Trường Thủy Nguyệt', master: 'Cô Thủy Nguyệt', elem: 'water', c: '#3a9aff', weapons: ['kunai', 'bow'], d: 'Bền bỉ, hồi máu, giảm sát thương. Bị động: Máu +12%.' },
    wind:  { n: 'Trường Phong Lôi', master: 'Thầy Phong Lôi', elem: 'wind',  c: '#2ac86a', weapons: ['blade', 'fan'], d: 'Nhanh nhẹn, chí mạng cao. Bị động: Chí mạng +6%.' }
};
const WEAPONS = {
    none:  { n: 'Tay không', ranged: false, icon: '👊', main: 'str' },
    sword: { n: 'Kiếm',     ranged: false, icon: '🗡️', main: 'str' },
    star:  { n: 'Phi tiêu', ranged: true,  icon: '✴️', main: 'agi' },
    kunai: { n: 'Kunai',    ranged: false, icon: '🔪', main: 'agi' },
    bow:   { n: 'Cung',     ranged: true,  icon: '🏹', main: 'agi' },
    blade: { n: 'Đao',      ranged: false, icon: '⚔️', main: 'str' },
    fan:   { n: 'Quạt',     ranged: true,  icon: '🌀', main: 'spi' }
};
const SKILL_INFO = {
    fire: {
        sword: [['Hỏa Trảm', '🔥'], ['Hỏa Ảnh Lướt', '💨'], ['Hỏa Long Quyển', '🌋'], ['Liệt Hỏa Tâm', '❤️‍🔥'], ['Phân Thân Thuật', '👥'], ['Thiên Hỏa Ngục', '☄️']],
        star:  [['Hỏa Tiêu', '🔥'], ['Liên Hoàn Tiêu', '✴️'], ['Bạo Viêm Trận', '🌋'], ['Liệt Hỏa Tâm', '❤️‍🔥'], ['Phân Thân Thuật', '👥'], ['Hỏa Vũ Thiên Tiêu', '☄️']]
    },
    water: {
        kunai: [['Băng Đao', '❄️'], ['Thủy Ảnh Lướt', '💨'], ['Băng Liên Hoa', '🪷'], ['Thủy Tâm Hộ Thể', '💧'], ['Phân Thân Thuật', '👥'], ['Băng Phong Bạo', '🌨️']],
        bow:   [['Băng Tiễn', '❄️'], ['Đa Trọng Tiễn', '🏹'], ['Hàn Băng Trận', '🪷'], ['Thủy Tâm Hộ Thể', '💧'], ['Phân Thân Thuật', '👥'], ['Vạn Tiễn Băng Vũ', '🌨️']]
    },
    wind: {
        blade: [['Phong Trảm', '🍃'], ['Tật Phong Bộ', '💨'], ['Lốc Xoáy Đao', '🌪️'], ['Phong Thần Tốc', '⚡'], ['Phân Thân Thuật', '👥'], ['Lôi Phong Bạo', '🌩️']],
        fan:   [['Phong Nhận', '🍃'], ['Cuồng Phong Phiến', '🌀'], ['Lốc Xoáy Trận', '🌪️'], ['Phong Thần Tốc', '⚡'], ['Phân Thân Thuật', '👥'], ['Thiên Lôi Phong', '🌩️']]
    }
};
const SK_MAX = 10;
function classSkills() {
    if (!S.school) return [];
    const R = WEAPONS[S.weapon].ranged, info = SKILL_INFO[S.school][S.weapon];
    const pc = v => Math.round(v * 100) + '%';
    const base = [
        { id: 's1', unlock: 5,  cd: 3,  mp: 10, kind: R ? 'proj' : 'slash', m: l => 2.0 + 0.2 * (l - 1), d: l => R ? `Phóng chiêu xuyên thấu gây ${pc(2.0 + 0.2 * (l - 1))} sát thương.` : `Chém mạnh phía trước gây ${pc(2.0 + 0.2 * (l - 1))} sát thương lên mọi kẻ địch.` },
        { id: 's2', unlock: 10, cd: 6,  mp: 18, kind: R ? 'spread' : 'dash', m: l => 1.5 + 0.15 * (l - 1), d: l => R ? `Bắn 5 đường tỏa ra, mỗi đường ${pc(1.5 + 0.15 * (l - 1))} sát thương.` : `Lướt tới trước (bất tử khi lướt), chém mọi kẻ trên đường đi ${pc(1.5 + 0.15 * (l - 1))} sát thương.` },
        { id: 's3', unlock: 15, cd: 9,  mp: 26, kind: 'aoe', m: l => 2.4 + 0.22 * (l - 1), d: l => `Nổ quanh người gây ${pc(2.4 + 0.22 * (l - 1))} sát thương lên kẻ địch xung quanh.` },
        { id: 's4', unlock: 20, cd: 25, mp: 30, kind: 'buff', d: l => SCHOOL_BUFF[S.school].d(l) },
        { id: 's5', unlock: 30, cd: 30, mp: 40, kind: 'clone', m: l => 0.6 + 0.06 * (l - 1), dur: l => 10 + l, d: l => `Gọi phân thân chiến đấu ${10 + l} giây, mỗi đòn ${pc(0.6 + 0.06 * (l - 1))} tấn công.` },
        { id: 's6', unlock: 40, cd: 20, mp: 60, kind: 'rain', m: l => 1.5 + 0.12 * (l - 1), d: l => `Trút 8 đòn xuống vùng phía trước, mỗi đòn ${pc(1.5 + 0.12 * (l - 1))} sát thương.` }
    ];
    return base.map((s, i) => ({ ...s, n: info[i][0], icon: info[i][1] }));
}
const SCHOOL_BUFF = {
    fire:  { d: l => `Tấn công +${20 + 2 * l}% trong 12 giây.`, apply: l => addBuff('atk', 20 + 2 * l, 12, '❤️‍🔥') },
    water: { d: l => `Hồi ${20 + 2 * l}% máu, giảm ${25 + l}% sát thương nhận trong 10 giây.`, apply: l => { healP(ST.hp * (20 + 2 * l) / 100); addBuff('red', 25 + l, 10, '💧'); } },
    wind:  { d: l => `Tốc chạy +30%, chí mạng +${15 + l}% trong 12 giây.`, apply: l => { addBuff('spd', 30, 12, '⚡'); addBuff('crit', 15 + l, 12, '⚡'); } }
};

// Trang bị
const SLOTS = [
    { id: 'weapon', n: 'Vũ khí', icon: '🗡️' }, { id: 'hat', n: 'Nón', icon: '🎩' }, { id: 'shirt', n: 'Áo', icon: '🥋' }, { id: 'gloves', n: 'Găng', icon: '🧤' }, { id: 'pants', n: 'Quần', icon: '👖' },
    { id: 'boots', n: 'Giày', icon: '🥾' }, { id: 'neck', n: 'Dây chuyền', icon: '📿' }, { id: 'ring', n: 'Nhẫn', icon: '💍' }, { id: 'jade', n: 'Ngọc bội', icon: '🟢' }, { id: 'charm', n: 'Bùa', icon: '🧧' }
];
const SLOT = Object.fromEntries(SLOTS.map(s => [s.id, s]));
const TIERS = [1, 10, 20, 30, 40, 50, 60];
const MATERIAL = ['Gỗ', 'Đồng', 'Sắt', 'Thép', 'Bạch Kim', 'Long Văn', 'Thần Binh'];
const SLOT_BASE = {
    weapon: T => ({ atk: 8 + T * 4.5 }),
    hat:    T => ({ hp: 30 + T * 9, def: 1 + T * 0.5 }),
    shirt:  T => ({ def: 3 + T * 1.4, hp: 20 + T * 6 }),
    gloves: T => ({ atk: 3 + T * 1.2, crit: 1 + T * 0.05 }),
    pants:  T => ({ def: 2 + T * 1.0, hp: 20 + T * 7 }),
    boots:  T => ({ hp: 15 + T * 5, dodge: 1 + T * 0.06 }),
    neck:   T => ({ hp: 25 + T * 8, mp: 15 + T * 4 }),
    ring:   T => ({ atk: 2 + T * 1.0, critDmg: 5 + T * 0.3 }),
    jade:   T => ({ mp: 20 + T * 5, spi: 2 + T * 0.4 }),
    charm:  T => ({ hp: 10 + T * 4, crit: 1 + T * 0.04 })
};
const STAT = {

function calcStats(eqO) {
    const EQ = eqO || S.equip, g = {};
    for (const sl in EQ) { const it = EQ[sl]; if (!it) continue; const st = itemStats(it); for (const k in st) g[k] = (g[k] || 0) + st[k]; }
    const L = S.level, st = {};
    for (const k of ['str', 'agi', 'vit', 'spi']) st[k] = S.stats[k] + (g[k] || 0);
    const main = WEAPONS[S.weapon].main;
    const others = st.str + st.agi + st.spi - st[main];
    let atk = (10 + st[main] * 2.2 + others * 0.4 + L * 1.5 + (g.atk || 0)) * (1 + (g.atkPct || 0) / 100);
    let hp = (100 + st.vit * 15 + L * 12 + (g.hp || 0)) * (1 + (g.hpPct || 0) / 100);
    let crit = 5 + st.agi * 0.12 + (g.crit || 0);
    if (S.school === 'fire') atk *= 1.1;
    if (S.school === 'water') hp *= 1.12;
    if (S.school === 'wind') crit += 6;
    const R = {
        prim: st, atk, hp, crit: Math.min(70, crit),
        mp: 50 + st.spi * 8 + L * 4 + (g.mp || 0),
        def: st.vit * 0.8 + L * 0.5 + (g.def || 0),
        critDmg: 150 + (g.critDmg || 0),
        dodge: Math.min(30, st.agi * 0.05 + (g.dodge || 0)),
        skillMult: 1 + st.spi * 0.006,
        mpRegen: 1 + st.spi * 0.06 + L * 0.06,
        xpF: g.xpF || 0, xuF: g.xuF || 0,
        elem: S.school ? SCHOOLS[S.school].elem : null
    };
    R.power = Math.round(R.atk * (1 + R.crit / 100 * (R.critDmg / 100 - 1)) * 5 + R.hp * 0.8 + R.def * 8);
    if (!eqO) ST = R;
    return R;
}

const keys = { left: false, right: false, down: false, atk: false };
function doJump() {

function stepPlayer(dt) {

        P.dashT -= dt; P.vx = P.dashDir * 1300; P.vy = 0;
        for (const m of W.mons) if (!m.dead && !P.dashHit.has(m) && Math.abs(m.x - P.x) < m.w / 2 + 30 && P.y - 60 < m.y && P.y > m.y - m.h - 20) { P.dashHit.add(m); hitMon(m, P.dashMult, { kb: 200 }); }

    const oy = P.y;
    P.x = clamp(P.x + P.vx * dt, 18, W.map.w - 18);
    P.y += P.vy * dt;
    P.onGround = false;
    if (P.dropT > 0) P.dropT -= dt;
    if (P.vy >= 0) {
        if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.onGround = true; }

}

function updateMon(m, dt) {

        } else if (Math.abs(dx) < m.range && Math.abs((P.y - 30) - (m.y - m.h / 2)) < m.h / 2 + 45) {

            W.delays.push({ t: 0.15, fn: () => { if (!m.dead && Math.abs(P.x - m.x) < m.range + 10 && Math.abs((P.y - 30) - (m.y - m.h / 2)) < m.h / 2 + 50) hurtPlayer(m.atk, m); } });

const Sfx = (() => {
    let ac = null, lastHit = 0;
    function init() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
    function tone(f, d, type = 'square', v = 0.03, f2) {
        if (!ac || !S || !S.sound) return;
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
        o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
    }
    return {
        init,
        jump: () => tone(300, 0.12, 'sine', 0.03, 600),
        swing: () => tone(500, 0.07, 'triangle', 0.025, 180),
        throw: () => tone(900, 0.06, 'square', 0.015, 400),
        hit: c => { const n = performance.now(); if (n - lastHit < 60) return; lastHit = n; tone(c ? 520 : 180, c ? 0.12 : 0.06, c ? 'sawtooth' : 'square', 0.025, c ? 200 : 90); },
        skill: () => tone(320, 0.25, 'triangle', 0.04, 900),
        pot: () => tone(600, 0.15, 'sine', 0.04, 1000),
        hurt: () => tone(160, 0.12, 'sawtooth', 0.03, 80),
        die: () => tone(300, 0.6, 'sawtooth', 0.05, 60),
        boom: () => tone(90, 0.4, 'sawtooth', 0.06, 40),
        level: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.05), i * 100)),
        up: ok => ok ? [700, 1050].forEach((f, i) => setTimeout(() => tone(f, 0.15, 'triangle', 0.05), i * 90)) : tone(220, 0.3, 'sawtooth', 0.04, 110)
    };
})();

function update(dt) {
    W.t += dt; if (W.shake > 0) W.shake -= dt;
    for (const k in P.cds) if (P.cds[k] > 0) P.cds[k] -= dt;
    P.atkT -= dt; P.atkAnim -= dt; P.inv -= dt; P.potT -= dt; P.mpotT -= dt; P.castT -= dt; P.edgeCd -= dt;
    for (const b of P.buffs) b.t -= dt; P.buffs = P.buffs.filter(b => b.t > 0);
    if (P.dead > 0) { P.dead -= dt; if (P.dead <= 0) respawn(); }
    else {
        stepPlayer(dt);
        if (keys.atk) basicAttack();
        const town = W.map.town;
        P.mp = Math.min(ST.mp, P.mp + ST.mpRegen * dt * (town ? 6 : 1));
        if (town) P.hp = Math.min(ST.hp, P.hp + ST.hp * 0.05 * dt);
        else if (W.t - P.lastHurt > 5) P.hp = Math.min(ST.hp, P.hp + ST.hp * 0.01 * dt);
    }
    updateClone(dt);
    for (const m of W.mons) updateMon(m, dt);
    updateProjs(dt);
    for (const d of W.delays) { d.t -= dt; if (d.t <= 0 && !d.done) { d.done = true; d.fn(); } }
    W.delays = W.delays.filter(d => !d.done);
    for (const f of W.fx) f.t += dt; W.fx = W.fx.filter(f => f.t < f.d);
    for (const t of W.texts) { t.t += dt; t.y -= 42 * dt; } W.texts = W.texts.filter(t => t.t < 1);
    for (const p of W.parts) { p.t += dt; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; } W.parts = W.parts.filter(p => p.t < 1.1);
    const target = clamp(P.x - VW / 2 + P.face * 70, 0, W.map.w - VW);
    W.camX += (target - W.camX) * Math.min(1, 5 * dt);
    // chuyển map ở mép
    if (P.edgeCd <= 0 && P.dead <= 0 && W.mons) {
        const id = W.id;
        if (P.x <= 22 && keys.left) {
            if (W.map.dungeon) enterMap(0, 2030);
            else if (!W.map.town) enterMap(id - 1, MAPS[id - 1].w - 70);
        } else if (P.x >= W.map.w - 22 && keys.right) {
            if (W.map.town) enterMap(1, 70);
            else if (!W.map.dungeon && id < FIELD_COUNT) enterMap(id + 1, 70);
        }
    }
    P.near = null;
    if (W.map.town && P.dead <= 0) for (const n of NPCS) if (Math.abs(n.x - P.x) < 60 && P.y > GROUND - 100) { P.near = n; break; }
    W.wbCheck -= dt; if (W.wbCheck <= 0) { W.wbCheck = 1; checkWorldBoss(); updateBossBar(); }
    updateDungeon(dt);
}
let lastT = 0, acc = 0, saveT = 0, uiT = 0;
function loop(ts) {
    requestAnimationFrame(loop);
    if (!lastT) lastT = ts;
    const dt = Math.min(0.1, (ts - lastT) / 1000); lastT = ts;
    if (S && W && P) {
        acc += dt; let n = 0;
        while (acc >= 1 / 60 && n < 6) { try { update(1 / 60); } catch (e) { console.error(e); } acc -= 1 / 60; n++; }
        if (n >= 6) acc = 0;
        uiT += dt; if (uiT > 0.12) { uiT = 0; updatePad(); }
        saveT += dt; if (saveT > 15) { saveT = 0; save(); }
    }
    try { render(); } catch (e) { console.error(e); }
}

    const name = ($('heroName').value || 'Ninja').trim().slice(0, 14) || 'Ninja';
    S = newSave(name); save(); closeModal(); startGame();
    setTimeout(() => toast('👴 Gặp Trưởng Làng hoặc mở 📜 để xem nhiệm vụ đầu tiên'), 1200);
}
setupPad();
S = load();
if (S) startGame(); else showIntro();
requestAnimationFrame(loop);
</script>
</body>
