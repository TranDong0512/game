<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚔️ Huyền Thoại Cày Cấp</title>
<style>
    :root { --bg: #0e0c18; --panel: #17142a; --panel2: #1f1b38; --line: rgba(255,255,255,.09); --text: #ece9ff; --dim: #9a95bd; --gold: #ffd257; --accent: #8b6cff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
    body { min-height: 100vh; }
    button { font-family: inherit; }
    #app { max-width: 1240px; margin: 0 auto; padding: 8px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 10px; }
    #top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
    .who { display: flex; align-items: center; gap: 10px; min-width: 230px; flex: 1; }
    .avatar { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; background: var(--panel2); border: 1px solid var(--line); }
    .who .nm { font-weight: 800; font-size: 15px; }
    .bar { position: relative; height: 12px; border-radius: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
    .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; transition: width .2s; }
    .bar span { position: absolute; inset: 0; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-shadow: 0 1px 2px #000; }
    .res { display: flex; gap: 12px; flex-wrap: wrap; font-weight: 800; }
    .res div { background: var(--panel2); border-radius: 20px; padding: 5px 11px; border: 1px solid var(--line); white-space: nowrap; }
    .cp { color: #ff9a6a; }
    #left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    #battle { width: 100%; aspect-ratio: 2 / 1; display: block; border-radius: 12px; background: #000; border: 1px solid var(--line); }
    #skills { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .sk.basic { cursor: default; border-style: dashed; }
    .sk.basic .mp { font-size: 9px; }
    @media (max-width: 560px) { .sk.basic .mp, .sk.basic .au { display: none; } .sk .au { font-size: 7px; top: 2px; right: 2px; } .sk .ic { font-size: 22px; } }
    .sk { position: relative; aspect-ratio: 1; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); cursor: pointer; overflow: hidden;
          display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
    .sk .ic { font-size: 26px; line-height: 1; }
    .sk .mp { font-size: 10px; color: #7fc8ff; font-weight: 800; margin-top: 2px; }
    .sk .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.65); }
    .sk .cdt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; text-shadow: 0 1px 3px #000; }
    .sk .au { position: absolute; top: 3px; right: 4px; font-size: 9px; font-weight: 900; color: #6dff9c; }
    .sk.locked { opacity: .45; cursor: default; }
    .sk.locked .ic { filter: grayscale(1); }
    .sk:not(.locked):not(.dim) { border-color: rgba(139,108,255,.75); box-shadow: 0 0 10px rgba(139,108,255,.35) inset; }
    .sk.dim .ic, .sk.dim .mp { opacity: .35; filter: grayscale(.8); }
    .sk .cd { display: none; }
    #ctrl { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-weight: 700; cursor: pointer; font-size: 13px; transition: .12s; user-select: none; }
    .btn:hover:not(:disabled) { border-color: var(--accent); background: #2a2450; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.pri { background: linear-gradient(135deg, #7b5cff, #b34dff); border: none; color: #fff; }
    .btn.ok { background: linear-gradient(135deg, #14a77f, #33d67a); border: none; color: #fff; }
    .btn.warn { background: linear-gradient(135deg, #e3334a, #ff7a3d); border: none; color: #fff; }
    .btn.on { border-color: #6dff9c; color: #6dff9c; }
    .btn.sm { padding: 5px 9px; font-size: 12px; }
    #log { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; height: 118px; overflow-y: auto; font-size: 12px; line-height: 1.55; color: var(--dim); }
    #log b { color: var(--text); }
    #right { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; max-height: calc(100vh - 92px); position: sticky; top: 8px; }
    #tabs { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
    .tab { padding: 9px 2px 7px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--dim); border-bottom: 2px solid transparent; user-select: none; position: relative; }
    .tab .i { font-size: 19px; display: block; }
    .tab.act { color: var(--text); border-bottom-color: var(--accent); background: rgba(139,108,255,.08); }
    .tab .dot { position: absolute; top: 5px; right: 18%; min-width: 16px; height: 16px; border-radius: 8px; background: #ff4d6d; color: #fff; font-size: 10px; line-height: 16px; padding: 0 4px; }
    #panel { padding: 12px; overflow-y: auto; flex: 1; }
    h4 { font-size: 13px; color: var(--gold); margin: 4px 0 8px; letter-spacing: .3px; }
    .sec { margin-bottom: 14px; }
    .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .slot { border: 2px solid var(--line); border-radius: 12px; background: var(--panel2); aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; padding: 4px; text-align: center; }
    .slot .ic { font-size: 26px; }
    .slot .lb { font-size: 10px; color: var(--dim); }
    .slot .pl { position: absolute; top: 3px; right: 5px; font-size: 11px; font-weight: 900; color: #ffe27a; }
    .slot .up { position: absolute; top: 2px; left: 4px; font-size: 11px; font-weight: 900; color: #6dff9c; }
    .slot.empty .ic { opacity: .3; filter: grayscale(1); }
    .inv { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .stat-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .stat-row .n { flex: 1; }
    .stat-row .n small { display: block; color: var(--dim); font-size: 11px; }
    .stat-row .v { font-weight: 900; min-width: 40px; text-align: right; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 13px; }
    .grid2 div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 3px 0; }
    .grid2 b { color: #fff; }
    .skill { display: flex; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--panel2); align-items: center; }
    .skill .ic { font-size: 32px; width: 48px; text-align: center; }
    .skill .bd { flex: 1; min-width: 0; }
    .skill .t { font-weight: 800; }
    .skill .d { color: var(--dim); font-size: 12px; margin-top: 2px; }
    .skill.locked { opacity: .5; }
    .zone { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; padding: 10px; background: var(--panel2); }
    .zone .hd { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 8px; }
    .stages { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .stg { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; cursor: pointer; background: rgba(0,0,0,.25); }
    .stg.done { background: rgba(54,214,122,.18); border-color: rgba(54,214,122,.5); }
    .stg.cur { outline: 2px solid var(--gold); }
    .stg.lock { opacity: .3; cursor: not-allowed; }
    .shop { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--panel2); }
    .shop .ic { font-size: 30px; }
    .shop .bd { flex: 1; }
    .shop .d { color: var(--dim); font-size: 12px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chip { padding: 4px 10px; border-radius: 14px; border: 1px solid var(--line); font-size: 12px; cursor: pointer; user-select: none; }
    .chip.on { border-color: currentColor; background: rgba(255,255,255,.07); font-weight: 800; }
    #modal, #intro { position: fixed; inset: 0; background: rgba(5,4,12,.75); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
    .hidden { display: none !important; }
    .box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: min(460px, 100%); max-height: 90vh; overflow-y: auto; }
    .box h3 { font-size: 18px; margin-bottom: 4px; }
    .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--panel2); font-size: 12.5px; }
    .card .ttl { font-weight: 800; margin-bottom: 4px; }
    .card .ln { display: flex; justify-content: space-between; padding: 1px 0; }
    .card .aff { color: #9fd0ff; }
    .better { color: #6dff9c; } .worse { color: #ff7070; }
    .classes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
    .cls { border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; background: var(--panel2); }
    .cls.sel { border-color: var(--accent); background: rgba(139,108,255,.15); }
    .cls .ic { font-size: 40px; }
    .cls .nm { font-weight: 900; margin: 4px 0; }
    .cls .d { font-size: 11.5px; color: var(--dim); }
    input.txt { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #0f0d1d; color: #fff; font-size: 15px; outline: none; }
    textarea.txt { width: 100%; height: 90px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #0f0d1d; color: #ddd; font-size: 11px; }
    #toasts { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 60; pointer-events: none; align-items: center; }
    .toast { background: rgba(20,16,40,.95); border: 1px solid var(--line); border-radius: 20px; padding: 7px 16px; font-weight: 800; font-size: 13px; animation: tin .25s; white-space: nowrap; }
    @keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
    @media (max-width: 900px) {
        #app { grid-template-columns: 1fr; }
        #right { max-height: none; position: static; }
        .inv { grid-template-columns: repeat(5, 1fr); }
        .tab { font-size: 10px; }
    }
</style>
</head>
<body>
<div id="app">
    <div id="top">
        <div class="who">
            <div class="avatar" id="tAvatar">⚔️</div>
            <div style="flex:1;min-width:0">
                <div class="nm"><span id="tName">Anh Hùng</span> · <span id="tLv">Lv 1</span> <span class="cp" id="tCp"></span></div>
                <div class="bar" style="margin-top:4px"><i id="tXp" style="background:linear-gradient(90deg,#8b6cff,#c06cff)"></i><span id="tXpT"></span></div>
            </div>
        </div>
        <div class="res">
            <div title="Vàng">💰 <span id="rGold">0</span></div>
            <div title="Đá cường hóa">🔷 <span id="rStone">0</span></div>
            <div title="Tinh thể">💎 <span id="rCrys">0</span></div>
            <div title="Bùa chuyển hóa">📜 <span id="rTrans">0</span></div>
            <div title="Bình máu (bấm để uống)" style="cursor:pointer" onclick="usePotion(true)">🧪 <span id="rPot">0</span></div>
            <div title="Bình mana (bấm để uống)" style="cursor:pointer" onclick="useMpPotion(true)">🔵 <span id="rMpot">0</span></div>
            <div title="Bùa bảo hộ">🛡️ <span id="rProt">0</span></div>
        </div>
    </div>

    <div id="left">
        <canvas id="battle" width="800" height="400"></canvas>
        <div id="skills"></div>
        <div id="ctrl">
            <button class="btn sm" onclick="changeStage(-1)">◀ Màn trước</button>
            <button class="btn sm" id="btnNextStage" onclick="changeStage(1)">Màn sau ▶</button>
            <button class="btn sm" id="btnAuto" onclick="toggleAuto()">⏩ Tự lên màn</button>
            <button class="btn sm" id="btnSpeed" onclick="toggleSpeed()">⚡ x1</button>
            <button class="btn sm" id="btnPot" onclick="toggleAutoPot()">🧪🔵 Tự uống</button>
        </div>
        <div id="log"></div>
    </div>

    <div id="right">
        <div id="tabs"></div>
        <div id="panel"></div>
    </div>
</div>

<div id="modal" class="hidden" onclick="if(event.target===this)closeModal()"><div class="box" id="modalBox"></div></div>
<div id="intro" class="hidden"><div class="box" style="width:min(620px,100%)" id="introBox"></div></div>
<div id="toasts"></div>

<script>
// =====================================================================
//  TIỆN ÍCH
// =====================================================================
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmt(n) {
    n = Math.floor(n);
    if (n < 10000) return String(n);
    const u = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
    let i = 0, x = n;
    while (x >= 1000 && i < u.length - 1) { x /= 1000; i++; }
    return (x < 100 ? x.toFixed(1) : Math.floor(x)) + u[i];
}
function fmtTime(s) {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return h ? `${h} giờ ${m} phút` : (m ? `${m} phút ${s % 60} giây` : `${s} giây`);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// =====================================================================
//  DỮ LIỆU GAME
// =====================================================================
const RARITY = [
    { n: 'Thường', c: '#c8c8d0', mult: 1.0, aff: 0 },
    { n: 'Tốt', c: '#4ade80', mult: 1.25, aff: 1 },
    { n: 'Hiếm', c: '#3b9cff', mult: 1.6, aff: 2 },
    { n: 'Sử Thi', c: '#b46cff', mult: 2.1, aff: 3 },
    { n: 'Huyền Thoại', c: '#ff9a1f', mult: 2.8, aff: 4 }
];
const DROP_W = [68, 23, 7, 1.7, 0.3], BOSS_W = [0, 45, 38, 14, 3], CHEST_W = [0, 50, 34, 13, 3];

const SLOTS = [
    { id: 'weapon', n: 'Vũ khí', icon: '🗡️' }, { id: 'helm', n: 'Mũ', icon: '⛑️' }, { id: 'armor', n: 'Áo giáp', icon: '🥋' },
    { id: 'gloves', n: 'Găng tay', icon: '🧤' }, { id: 'boots', n: 'Giày', icon: '👢' }, { id: 'ring', n: 'Nhẫn', icon: '💍' }, { id: 'amulet', n: 'Dây chuyền', icon: '📿' }
];
const SLOT = Object.fromEntries(SLOTS.map(s => [s.id, s]));
const MATERIAL = ['Gỗ', 'Sắt', 'Thép', 'Bạch Kim', 'Long Lân', 'Thần Thánh', 'Hư Không'];

const STAT = {
    atk: { n: 'Tấn công' }, hp: { n: 'Máu' }, def: { n: 'Phòng thủ' },
    str: { n: 'Sức mạnh' }, agi: { n: 'Nhanh nhẹn' }, int: { n: 'Trí tuệ' }, vit: { n: 'Thể lực' },
    crit: { n: 'Chí mạng', p: 1 }, critDmg: { n: 'ST chí mạng', p: 1 }, aspd: { n: 'Tốc đánh', p: 1 }, atkPct: { n: 'Tấn công', p: 1 },
    hpPct: { n: 'Máu', p: 1 }, ls: { n: 'Hút máu', p: 1 }, dodge: { n: 'Né tránh', p: 1 }, goldF: { n: 'Vàng nhận', p: 1 }, xpF: { n: 'Kinh nghiệm', p: 1 },
    defPct: { n: 'Phòng thủ', p: 1 }, mpPct: { n: 'Năng lượng', p: 1 }, mpRegenPct: { n: 'Hồi năng lượng', p: 1 }, skillDmg: { n: 'ST kỹ năng', p: 1 },
    cdr: { n: 'Giảm hồi chiêu', p: 1 }, mpCost: { n: 'Giảm tiêu hao năng lượng', p: 1 }, dmgRed: { n: 'Giảm sát thương nhận', p: 1 }
};
// Nội tại trang bị: kích hoạt khi cường hóa đạt +4 / +8 / +10 / +12
const PASSIVE_LV = [4, 8, 10, 12];
const PASSIVE = {
    weapon: [{ atkPct: 6 }, { crit: 4 }, { critDmg: 25 }, { skillDmg: 15 }],
    helm:   [{ hpPct: 6 }, { mpPct: 15 }, { defPct: 10 }, { hpPct: 12, mpRegenPct: 30 }],
    armor:  [{ defPct: 8 }, { hpPct: 8 }, { dodge: 4 }, { defPct: 15, hpPct: 10 }],
    gloves: [{ aspd: 5 }, { crit: 4 }, { atkPct: 8 }, { aspd: 10, critDmg: 20 }],
    boots:  [{ dodge: 3 }, { aspd: 6 }, { hpPct: 8 }, { dodge: 5, mpRegenPct: 30 }],
    ring:   [{ critDmg: 15 }, { ls: 2 }, { atkPct: 8 }, { skillDmg: 12, crit: 3 }],
    amulet: [{ xpF: 10 }, { goldF: 10 }, { ls: 2 }, { skillDmg: 10, atkPct: 8 }]
};
const statTxt = o => Object.entries(o).map(([k, v]) => `${STAT[k].n} +${STAT[k].p ? (+v.toFixed(1)) + '%' : fmt(v)}`).join(', ');
// Bộ cường hóa: đủ 7 món cùng đạt +10 / +12, sức mạnh theo cấp đồ thấp nhất trong bộ
const SET_TIERS = [
    { plus: 10, n: 'Bộ Cường Hóa +10', b: l => { const v = Math.min(40, 10 + l * 0.2); return { atkPct: v, hpPct: v, defPct: v }; } },
    { plus: 12, n: 'Bộ Cường Hóa +12', b: l => ({ atkPct: Math.min(40, 10 + l * 0.2), hpPct: Math.min(40, 10 + l * 0.2), skillDmg: Math.min(40, 10 + l * 0.2), critDmg: Math.min(80, 20 + l * 0.4) }) }
];
function setInfo(eq) {
    const items = SLOTS.map(sl => eq[sl.id]).filter(Boolean);
    const minLv = items.length === SLOTS.length ? Math.min(...items.map(i => i.ilvl)) : 0;
    return SET_TIERS.map(t => ({ ...t, count: items.filter(i => i.plus >= t.plus).length, active: items.length === SLOTS.length && items.every(i => i.plus >= t.plus), bonus: t.b(minLv || 1), minLv }));
}
function itemPassives(it) { const o = {}; PASSIVE[it.slot].forEach((p, i) => { if (it.plus >= PASSIVE_LV[i]) for (const k in p) o[k] = (o[k] || 0) + p[k]; }); return o; }
// Chỉ số gốc tăng theo cấp số nhân (chậm hơn quái một chút, phần còn lại bù bằng cường hóa và độ hiếm)
const GEAR_G = l => Math.pow(1.105, l - 1);
const SLOT_BASE = {
    weapon: l => ({ atk: 7 * GEAR_G(l) }),
    helm:   l => ({ hp: 34 * GEAR_G(l), def: 1.3 * GEAR_G(l) }),
    armor:  l => ({ def: 3.9 * GEAR_G(l), hp: 20 * GEAR_G(l) }),
    gloves: l => ({ atk: 2.8 * GEAR_G(l), crit: 1 + Math.min(4, l * 0.05) }),
    boots:  l => ({ hp: 21 * GEAR_G(l), aspd: 2 + Math.min(6, l * 0.06) }),
    ring:   l => ({ atk: 1.6 * GEAR_G(l), critDmg: 5 + Math.min(20, l * 0.25) }),
    amulet: l => ({ hp: 27 * GEAR_G(l), atkPct: 2 + Math.min(8, l * 0.08) })
};
const AFFIX = {
    str: l => (2 + l * 0.45) * Math.pow(1.03, l), agi: l => (2 + l * 0.45) * Math.pow(1.03, l), int: l => (2 + l * 0.45) * Math.pow(1.03, l), vit: l => (2 + l * 0.45) * Math.pow(1.03, l),
    atkPct: l => Math.min(25, 3 + l * 0.06), hpPct: l => Math.min(25, 3 + l * 0.06), crit: l => Math.min(10, 1.5 + l * 0.04),
    critDmg: l => Math.min(50, 8 + l * 0.2), aspd: l => Math.min(15, 3 + l * 0.05), ls: l => Math.min(6, 1 + l * 0.02),
    dodge: l => Math.min(8, 1 + l * 0.03), goldF: l => Math.min(40, 5 + l * 0.2), xpF: l => Math.min(40, 5 + l * 0.2)
};

const CLASSES = {
    warrior: { n: 'Chiến Binh', icon: '⚔️', main: 'str', color: '#e25555',

function rankOf(tier) {
    if (!tier) return null;

    const RN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X'];
    return { n: 'Master' + (k > 1 ? ' ' + (k <= 10 ? RN[k] : k) : ''), c: '#ffd257', m: 2.45 * Math.pow(1.12, k - 1), master: 1 };
}

const KILLS_PER_STAGE = 15, BOSS_TIME = 40;
const isHardStage = s => s % 10 === 5;
const killsNeed = s => isHardStage(s) ? 8 : KILLS_PER_STAGE;
const xpNeed = lv => Math.round(50 * Math.pow(1.215, lv - 1) + 40 * lv);
function zoneOf(stage) { const i = stage - 1; return { z: Math.floor(i / 10) % ZONES.length, tier: Math.floor(i / (10 * ZONES.length)), sub: i % 10 + 1 }; }
function stageName(stage) { const { z, tier, sub } = zoneOf(stage); const r = rankOf(tier); return `${ZONES[z].n}${r ? ' [' + r.n + ']' : ''} ${z + 1 + tier * ZONES.length}-${sub}`; }
const isBossStage = s => s % 10 === 0;
function monStats(stage, boss) {
    const r = rankOf(zoneOf(stage).tier), rm = r ? r.m : 1, rr2 = r ? 1 + (rm - 1) * 1.5 : 1;
    return {
        rank: r,
        hp: 58 * Math.pow(1.15, stage - 1) * (boss ? 8 : 1) * rm,
        atk: 7.5 * Math.pow(1.12, stage - 1) * (boss ? 1.4 : 1) * rm,
        def: stage * 1.5,
        xp: 6 * Math.pow(1.13, stage - 1) * (boss ? 6 : 1) * rr2,
        gold: 6.6 * Math.pow(1.14, stage - 1) * (boss ? 8 : 1) * rr2
    };
}

}

function computeStats(eqOverride, extraBuff) {

    for (const sl in eq) { const it = eq[sl]; if (!it) continue; addG(itemStats(it)); addG(itemPassives(it)); }
    for (const t of setInfo(eq)) if (t.active) addG(t.bonus);

    atk *= 1 + (g.atkPct || 0) / 100;

    const mp = (40 + pr.int * 4 + lv * 2) * C.mpMult * (1 + (g.mpPct || 0) / 100);
    const def = (pr.vit * 0.6 + lv * 0.6 + (g.def || 0)) * (1 + (g.defPct || 0) / 100);
    const crit = Math.min(75, 5 + pr.agi * 0.12 + (g.crit || 0) + C.critBonus);
    const critDmg = 150 + (g.critDmg || 0);
    const aspd = Math.min(3.5, 1 + (pr.agi * 0.25 + (g.aspd || 0) + C.aspdBonus) / 100);
    const dodge = Math.min(40, pr.agi * 0.08 + (g.dodge || 0));

        cdr: Math.min(40, g.cdr || 0), mpCost: Math.min(40, g.mpCost || 0), dmgRed: Math.min(50, g.dmgRed || 0) };

}

const Sfx = (() => {

    function tone(f, d, type = 'square', v = 0.03, f2) {
        if (!ac || !S || !S.sound || document.hidden) return;
        const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
        o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);

        init,
        hit: () => { const n = performance.now(); if (n - last < 70) return; last = n; tone(180, 0.06, 'square', 0.02, 90); },
        crit: () => tone(520, 0.1, 'sawtooth', 0.03, 200),
        skill: () => tone(300, 0.25, 'triangle', 0.04, 900),

function updateBattle(dt) {

function drawFx() {
    const mons = alive();
    for (const p of B.proj) {
        const tgt = p.tgt && p.tgt.hp > 0 ? p.tgt : (mons[0] || null);
        if (p.t < 0 || !tgt && p.k !== 'arcane') continue;
        const k = clamp(p.t / p.d, 0, 1);
        const tx = tgt ? tgt.x : CW * 0.7, ty = tgt ? monY(tgt) - monH(tgt) / 2 : GROUND - 60;
        const x = p.x + (tx - p.x) * k, y = p.y + (ty - p.y) * k - Math.sin(k * Math.PI) * (p.k === 'arcane' ? 60 : 20);
        if (p.k === 'arrow') { ctx.strokeStyle = '#f0e0c0'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 22, y); ctx.lineTo(x, y); ctx.stroke(); ctx.fillStyle = '#ccc'; ctx.beginPath(); ctx.moveTo(x + 6, y); ctx.lineTo(x - 2, y - 4); ctx.lineTo(x - 2, y + 4); ctx.fill(); }

        ctx.globalAlpha = a;
        switch (f.k) {
            case 'slash': ctx.strokeStyle = f.c; ctx.lineWidth = 8 * a + 2; ctx.beginPath(); ctx.arc(f.x - 10, f.y, 44, -1.2 + k, 0.8 + k); ctx.stroke(); break;

            case 'frost': ctx.fillStyle = 'rgba(160,220,255,.35)'; ctx.fillRect(380, 0, CW - 380, CH); ctx.fillStyle = '#e0f6ff'; for (let i = 0; i < 20; i++) { ctx.fillRect(400 + (i * 53) % 380, (i * 37 + k * 300) % GROUND, 4, 4); } break;
            case 'meteor': {

                ctx.fillStyle = '#ff7a2a'; ctx.beginPath(); ctx.arc(mx, my, 40, 0, 7); ctx.fill(); ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(mx, my, 22, 0, 7); ctx.fill();

                break;
            }
            case 'rain': ctx.strokeStyle = '#f0e0c0'; ctx.lineWidth = 2; for (let i = 0; i < 30; i++) { const x = 420 + (i * 37) % 360, y = ((i * 71) % 200 + k * 400) % (GROUND + 40) - 40; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 8, y - 24); ctx.stroke(); } break;

    if (!src || !dst || dst === src || dst.slot !== src.slot || dst.plus >= src.plus) return false;
    const c = transCost(src, dst);
    if (S.trans < c.trans || S.stones < c.stones || S.gold < c.gold) { toast('Không đủ nguyên liệu'); return false; }
    S.trans -= c.trans; S.stones -= c.stones; S.gold -= c.gold;
    const okk = Math.random() * 100 < c.rate;
    if (okk) {
        dst.plus = src.plus; src.plus = 0;
        dst.inv.stones += src.inv.stones; dst.inv.crys += src.inv.crys; src.inv = { stones: 0, crys: 0 };
        dst.lock = true;
        toast(`✅ Chuyển hóa thành công! ${esc(dst.name)} +${dst.plus}`); log(`📜 Chuyển hóa: <b>${esc(dst.name)} +${dst.plus}</b>`);
        // chuyển sang chọn món mới để người chơi mặc / cường hóa tiếp
        forgeSel = S.equip[dst.slot] === dst ? dst.slot : 'inv:' + dst.id;
    } else toast('❌ Chuyển hóa thất bại, mất nguyên liệu (cấp + vẫn giữ nguyên)');
    Sfx.up(okk);
    afterStatChange();
    return okk;
}

function buy(k, n) {
    const price = shopPrice[k]() * n;
    if (S.gold < price) { toast('Không đủ vàng'); return; }
    if (k === 'chest' && S.inv.length >= 60) { toast('Túi đã đầy'); return; }
    S.gold -= price;
    if (k === 'potion') S.potions += n;
    else if (k === 'stones') S.stones += 5 * n;
    else if (k === 'crys') S.crys += n;
    else if (k === 'trans') S.trans += n;
    else if (k === 'mpot') S.mpots += n;
    else if (k === 'prot') S.prot += n;
    else if (k === 'chest') {
        const r = rollRarity(CHEST_W); const it = makeItem(S.maxStage, r); S.inv.push(it);
        toast(`🎁 Mở rương: <span style="color:${RARITY[r].c}">${itemIcon(it)} ${RARITY[r].n} ${esc(it.name)}</span>`); Sfx.loot(r);
    } else if (k === 'respec') {
        const tot = S.stats.str + S.stats.agi + S.stats.int + S.stats.vit;
        S.points += tot; S.stats = { str: 0, agi: 0, int: 0, vit: 0 }; afterStatChange(); toast(`🔄 Hoàn lại ${tot} điểm chỉ số`); tab = 'char';
    }
    markDirty(); save();
}

    S = newSave(pickCls, name);
    // Trang bị khởi đầu
    S.equip.weapon = makeItem(1, 0, 'weapon'); S.equip.armor = makeItem(1, 0, 'armor');
    save();
    $('intro').classList.add('hidden');
    startGame();
    log(`🌟 Chào mừng <b>${esc(name)}</b> (${CLASSES[pickCls].n})! Hãy cộng điểm chỉ số ở tab Nhân vật khi lên cấp.`);
}
function offlineRewards() {
    const secs = Math.min(8 * 3600, (Date.now() - (S.lastSave || Date.now())) / 1000);
    if (secs < 60) return;
    refreshStats();
    const st = Math.max(1, S.stage), ms = monStats(st, false);
    const dps = ST.atk * ST.aspd * (1 + ST.crit / 100 * (ST.critDmg / 100 - 1)) * (1 - st * 1.5 / (st * 1.5 + 100));
    const perKill = ms.hp / Math.max(1, dps) + 0.8;
    const kills = Math.floor(secs / perKill * 0.5);
    if (kills <= 0) return;
    const xp = kills * ms.xp * (1 + ST.xpF / 100), gold = kills * ms.gold * (1 + ST.goldF / 100), stones = Math.floor(kills * 0.28), crys = Math.floor(kills * 0.04);
    const lv0 = S.level;
    S.gold += gold; S.stones += stones; S.crys += crys;
    gainXpSilent(xp);
    $('modalBox').innerHTML = `<h3>🌙 Trong lúc bạn vắng mặt</h3><div style="color:var(--dim);margin-bottom:10px">${fmtTime(secs)} · nhân vật đã hạ ${fmt(kills)} quái ở ${stageName(st)}</div>
        <div class="grid2" style="font-size:15px"><div>💰 Vàng <b>+${fmt(gold)}</b></div><div>✨ Kinh nghiệm <b>+${fmt(xp)}</b></div><div>🔷 Đá cường hóa <b>+${fmt(stones)}</b></div><div>💎 Tinh thể <b>+${fmt(crys)}</b></div><div>⬆️ Cấp độ <b>${lv0} → ${S.level}</b></div></div>
        <div style="margin-top:14px"><button class="btn pri" onclick="closeModal()">Nhận thưởng</button></div>`;
    $('modal').classList.remove('hidden');
}
function gainXpSilent(x) {
    S.xp += x;
    while (S.xp >= xpNeed(S.level)) {
        S.xp -= xpNeed(S.level); S.level++; S.points += 5; S.skillPts += 2;
        const unl = SKILLS[S.cls].find(s => s.unlock === S.level); if (unl) S.skills[unl.id] = Math.max(1, S.skills[unl.id]);
    }
}
function startGame() {
    if (!S.passives) S.passives = {};
    if (!S.pasV) { S.pasV = 1; if (S.level > 1) { S.skillPts += S.level - 1; setTimeout(() => toast(`🎁 Cập nhật chiêu bị động: tặng thêm ${S.level - 1} điểm kỹ năng`), 800); } }
    lastSetTier = null;
    if (S.trans == null) S.trans = 0;
    if (S.mpots == null) S.mpots = 5;
    if (S.prot == null) S.prot = 0;
    if (S.useProt == null) S.useProt = true;
    for (const sk of SKILLS[S.cls]) { if (S.skills[sk.id] == null) S.skills[sk.id] = 0; if (S.auto[sk.id] == null) S.auto[sk.id] = true; if (S.level >= sk.unlock && !S.skills[sk.id]) S.skills[sk.id] = 1; }
    refreshStats();
    newBattle();
    renderSkillBar();
    tab = 'char'; dirty = true;
}

// =====================================================================
//  VÒNG LẶP
// =====================================================================
let lastT = 0, acc = 0, saveT = 0, uiT = 0;
function loop(ts) {
    requestAnimationFrame(loop);
    if (!S || !B) return;
    if (!lastT) lastT = ts;
    let dt = Math.min(0.25, (ts - lastT) / 1000); lastT = ts;
    acc += dt * S.speed;
    let n = 0;
    while (acc >= 1 / 60 && n < 20) { try { updateBattle(1 / 60); } catch (e) { console.error(e); } acc -= 1 / 60; n++; }
    if (n >= 20) acc = 0;
    try { drawBattle(); } catch (e) { console.error(e); }
    uiT += dt; saveT += dt;
    if (uiT > 0.2) { uiT = 0; renderTop(); updateSkillBar(); if (dirty) { dirty = false; renderPanel(); } }
    if (saveT > 10) { saveT = 0; save(); }
}
// Khi tab bị ẩn, trình duyệt dừng vẽ: tiếp tục mô phỏng bằng bộ hẹn giờ để không mất thời gian cày
setInterval(() => {
    if (!document.hidden || !S || !B) return;
    for (let i = 0; i < 60 * S.speed; i++) updateBattle(1 / 60);
    renderTop();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else { lastT = 0; dirty = true; } });
window.addEventListener('beforeunload', save);

S = load();
if (S) { offlineRewards(); startGame(); log(`👋 Chào mừng trở lại, <b>${esc(S.name)}</b>!`); }
else showIntro();
requestAnimationFrame(loop);
</script>
