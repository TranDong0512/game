<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Link Resolver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; padding: 16px 0; }
        .container { background: #16213e; padding: 2rem; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 1.5rem; font-size: 1.4rem; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #0f3460; border-radius: 8px; background: #0a0a1a; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #e94560; }
        button { width: 100%; margin-top: 12px; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #c73e54; }
        button:disabled { background: #555; cursor: not-allowed; }
        .result { margin-top: 1.5rem; background: #0a0a1a; padding: 16px; border-radius: 8px; display: none; word-break: break-all; font-size: 0.9rem; line-height: 1.6; }
        .result.show { display: block; }
        .result a { color: #4fc3f7; }
        .result pre { white-space: pre-wrap; color: #a0d2db; }
        .error { color: #e94560; }
        .game-link { display: flex; align-items: center; gap: 12px; width: 90%; max-width: 500px; padding: 14px 18px; border-radius: 12px; text-decoration: none; color: #fff;
                     background: linear-gradient(135deg, #6a4cff, #b44cff); box-shadow: 0 8px 24px rgba(106,76,255,.35); transition: transform .15s; }
        .game-link:hover { transform: translateY(-2px); }
        .game-link .ic { font-size: 2rem; }
        .game-link b { display: block; font-size: 1.1rem; }
        .game-link small { opacity: .85; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Link Resolver</h1>
        <input type="text" id="url" placeholder="Nhập link TikTok..." value="https://vt.tiktok.com/ZS9SBFaVK5UHL-nRXbY/">
        <button id="btn" onclick="resolve()">Resolve</button>
        <div class="result" id="result"></div>
    </div>
    <a class="game-link" href="idle-rpg.html">
        <span class="ic">⚔️</span>
        <span><b>Huyền Thoại Cày Cấp</b><small>Game nhập vai cày cấp tự động — bấm để chơi</small></span>
    </a>
    <a class="game-link" href="ninja.html" style="background:linear-gradient(135deg,#ff6a3a,#c8283a)">
        <span class="ic">🥷</span>
        <span><b>Làng Ninja Huyền Thoại</b><small>Nhập vai ninja: đánh quái, trường phái, cường hóa +16, boss thế giới</small></span>
    </a>
    <script src="app.js"></script>
</body>
</html>
